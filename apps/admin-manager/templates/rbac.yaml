# admin-manager 권한 = 발급 템플릿(readonly, namespace-write)의 합집합
#                     + 개발자 계정 발급용 ServiceAccount/Role/RoleBinding 생성·삭제와 토큰 발급
#                     + 매니페스트 화이트리스트 Kind (Deployment, Service, ConfigMap, PVC, NetworkPolicy, HTTPRoute)
# Secret 은 읽기·쓰기 모두 없음 (admin_manager helpers/manifestWhitelistHelper.cjs 결정).
# 코드의 템플릿(helpers/rbacTemplateHelper.cjs)이 바뀌면 이 규칙도 같이 바꿔야 한다
# (K8s RBAC 은 자기가 가진 권한 이상을 담은 Role 을 만들지 못하게 막는다).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin-manager
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: admin-manager
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "create", "delete"]
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps", "events", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
# 모든 네임스페이스 읽기 전용 (모니터링 웹 네임스페이스 YAML 화면 — 관리자는 전부 볼 수 있게).
# 쓰기는 위 ClusterRole 을 rbac.namespaces 에만 RoleBinding 으로 묶어 그대로 제한한다.
# Secret 은 여기서도 없음.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: admin-manager-read
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "events", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: admin-manager-read
subjects:
  - kind: ServiceAccount
    name: admin-manager
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin-manager-read
{{- if .Values.rbac.clusterWide }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: admin-manager
subjects:
  - kind: ServiceAccount
    name: admin-manager
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin-manager
{{- else }}
{{- range .Values.rbac.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: admin-manager
  namespace: {{ . }}
subjects:
  - kind: ServiceAccount
    name: admin-manager
    namespace: {{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin-manager
{{- end }}
{{- end }}
