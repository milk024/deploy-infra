{{- if .Values.gateway.enabled }}
# 외부 경로: https://{{ .Values.gateway.hostname }}{{ .Values.gateway.pathPrefix }}/... → admin-manager /api/...
# 대시보드(monitoring-web)와 같은 출처라 브라우저 CORS 문제가 없다.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: admin-manager
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.existingGatewayName }}
      namespace: {{ .Release.Namespace }}
      sectionName: {{ .Values.gateway.existingGatewaySectionName }}
  hostnames:
    - {{ .Values.gateway.hostname }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.gateway.pathPrefix }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /api
      backendRefs:
        - name: admin-manager
          port: {{ .Values.service.port }}
{{- end }}
