# admin-manager 배포 값 (ArgoCD 기준, 2026-11-13 첫 배포 테스트)
# 비밀값은 여기에 두지 않는다. 클러스터에서 별도 관리하는 Secret:
#   admin-manager-db  : PGDATABASE, PGUSER, PGPASSWORD  (Gitea Postgres 안의 전용 DB·계정)
#   admin-manager-app : JWT_SECRET
#   admin-manager-gitea-mgmt : GITEA_MGMT_TOKEN (gitea-mgmt-svc 토큰, Gitea 사용자·팀 관리)
#     (ADMIN_BOOTSTRAP_USERNAME/PASSWORD 는 최초 관리자 생성용 — 2026-11-17 생성 후 제거. DB 가 비었을 때만 다시 넣는다)
# image.tag 는 CI(infra-ci)가 갱신한다.
image:
  repository: gpu.example.ac.kr/myorg/admin-manager
  tag: 9b784224d084ad8eed573e054f44b8a3d72c1cc0
  pullPolicy: IfNotPresent
  pullSecretName: gitea-registry-cred   # infra-ci 읽기 전용 토큰 (k8s-manager-registry-secret 은 gitea_admin 비밀번호라 폐기)
replicaCount: 1
service:
  port: 8100
config:
  PORT: '8100'
  PGHOST: gitea-postgresql.infra.svc.cluster.local
  PGPORT: '5432'
  JWT_EXPIRES_IN: 8h
  ALLOWED_ORIGINS: https://gpu.example.ac.kr
  # Gitea 사용자·팀 관리 — 클러스터 내부 주소. Owners·ci-*·svc-* 팀과 그 구성원, site admin 은 변경 거부
  GITEA_BASE_URL: http://gitea-http.infra.svc.cluster.local:3000
  GITEA_ORG: myorg
  GITEA_PROTECTED_TEAMS: Owners,ci-*,svc-*
  K8S_PUBLIC_API_SERVER: https://10.0.0.20:6443   # 발급 kubeconfig 의 API 서버 주소 (인증서 SAN 에 포함된 IP)
# 외부 경로 (학내망): https://gpu.example.ac.kr/api-admin/... → /api/...
gateway:
  enabled: true
  existingGatewayName: infra-gateway
  existingGatewaySectionName: https
  hostname: gpu.example.ac.kr
  pathPrefix: /api-admin
dbSecretName: admin-manager-db
appSecretName: admin-manager-app
giteaMgmtSecretName: admin-manager-gitea-mgmt
# 권한 범위
#   clusterWide: false → namespaces 에 나열한 곳에만 RoleBinding (기본)
#   clusterWide: true  → ClusterRoleBinding. kube-system 포함 모든 네임스페이스 → 사실상 cluster-admin
#   namespace 모드에서 목록을 늘리면 ArgoCD AppProject infra 의 destinations 에도 추가해야 한다.
rbac:
  clusterWide: false
  namespaces:
    - rag-system
    - vkey-system
