{{- /*
  deploy-infra(ArgoCD) 에서는 values 에 secret 을 두지 않는다 → 이 Secret 은 렌더링되지 않고,
  클러스터의 k8s-manager-secret(GITEA_WEBHOOK_SECRET)을 별도로 관리한다(Deployment 는 이름으로 참조).
  values 에 secret 맵을 주면 예전처럼 생성한다(로컬 helm 배포 호환).
*/}}
{{- if .Values.secret }}
apiVersion: v1
kind: Secret
metadata:
  name: k8s-manager-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
{{- range $key, $value := .Values.secret }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end }}
