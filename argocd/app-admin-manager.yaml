# Application admin-manager — finalizer 없음: Application 을 지워도 클러스터 리소스는 남는다(실수로 인한 삭제 방지)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: admin-manager
  namespace: argocd
spec:
  project: infra
  source:
    repoURL: https://gpu.example.ac.kr/gitea/myorg/deploy-infra.git
    targetRevision: main
    path: apps/admin-manager
    helm:
      releaseName: admin-manager
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: infra
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
