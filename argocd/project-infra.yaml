# AppProject infra — deploy-infra 만 읽고, infra 네임스페이스에만 배포
# 클러스터 범위 리소스는 k8s-manager 의 조회 권한(ClusterRole/ClusterRoleBinding k8s-manager-read)용으로만 허용.
# (ArgoCD 화이트리스트는 종류(kind) 단위라, 이름 제한은 deploy-infra main 보호(PR + maintainers 승인)로 건다)
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: infra
  namespace: argocd
spec:
  description: infra 네임스페이스 (k8s-manager, monitoring-web, admin-manager) + admin-manager 권한 RoleBinding (rag-system, vkey-system)
  sourceRepos:
    # 2026-11-17 https 주소로 전환 (Gitea push 웹훅 주소와 같아야 ArgoCD 가 즉시 새로고침). 예전 ssh 주소·배포 키는 같은 날 정리
    - https://gpu.example.ac.kr/gitea/myorg/deploy-infra.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: infra
    # admin-manager 의 RoleBinding 만 둔다 (apps/admin-manager values rbac.namespaces 와 맞출 것)
    - server: https://kubernetes.default.svc
      namespace: rag-system
    - server: https://kubernetes.default.svc
      namespace: vkey-system
  clusterResourceWhitelist:
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceBlacklist:
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange
